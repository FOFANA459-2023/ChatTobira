# Accepted vulnerabilities, with reasons and an expiry date.
#
# Everything here is reviewed again when it expires. An exception with no
# end date is just a silenced alarm, and a scanner nobody trusts is worse
# than no scanner at all — so this file stays short and each entry says why.

vulnerabilities:
  - id: CVE-2026-45623
    paths:
      - "app/.open-next/server-functions/default/node_modules/next/node_modules/postcss/package.json"
    statement: |
      postcss 8.4.31 is vendored inside next at a version next pins itself:
      updating next across the whole 15.x range (15.5.23 -> 15.5.25) does not
      move it, so the only fix available is a major upgrade to next 16, which
      is not a change to make inside a security exception.

      Not reachable in this deployment. postcss is a build-time CSS
      transformer; the worker bundle carries it as dead weight and never
      feeds it input at runtime. The CVE requires attacker-controlled CSS
      reaching the parser, and no path in this app does that — students send
      chat messages and upload images or PDFs, none of which is ever parsed
      as CSS.

      Revisit when next 16 is considered on its own merits.
    expiredAt: 2026-12-03

  - id: CVE-2026-73646
    paths:
      - "app/.open-next/server-functions/default/node_modules/next/node_modules/postcss/package.json"
    statement: |
      Same package, same pinned version, same reasoning as CVE-2026-45623:
      postcss is vendored by next, is build-time only, and receives no
      untrusted input at runtime in this application.
    expiredAt: 2026-12-03
