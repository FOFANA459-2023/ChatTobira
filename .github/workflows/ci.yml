name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Secrets must never land in history. Runs first and fast.
  # -------------------------------------------------------------------------
  secrets-scan:
    name: Security / secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # Python ingestion pipeline
  # -------------------------------------------------------------------------
  python-lint:
    name: Lint / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check ingest
      - run: ruff format --check ingest

  python-test:
    name: Unit / pytest (ingest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ingest pytest
      - name: Run unit tests
        run: python -m pytest ingest/tests -q
        env:
          PYTHONIOENCODING: utf-8

  python-audit:
    name: Security / pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ingest pip-audit
      # Vulnerabilities in transitive deps fail the build; fix or pin.
      - run: pip-audit

  # -------------------------------------------------------------------------
  # Web app (Next.js on Cloudflare Workers). These jobs detect whether web/
  # exists yet so the pipeline is complete now and activates the moment the
  # app lands — no workflow changes needed then.
  # -------------------------------------------------------------------------
  web-detect:
    name: Web / detect
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "web/ not present yet — web jobs will no-op green."
          fi

  web-lint-typecheck:
    name: Web / lint + typecheck
    needs: web-detect
    if: needs.web-detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  web-unit:
    name: Unit + component / vitest
    needs: web-detect
    if: needs.web-detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run

  web-e2e:
    name: E2E / playwright
    needs: web-detect
    if: needs.web-detect.outputs.exists == 'true'
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # -------------------------------------------------------------------------
  # Gate: the single required status for branch protection. Point the rule at
  # this job only, so adding/removing jobs never requires touching settings.
  # -------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    needs:
      [
        secrets-scan,
        python-lint,
        python-test,
        python-audit,
        web-detect,
        web-lint-typecheck,
        web-unit,
        web-e2e,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no job failed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "A required job failed."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # Deploy to Cloudflare Workers — main only, after everything is green.
  # Requires repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy / Cloudflare Workers
    needs: [ci-ok, web-detect]
    # Skips cleanly until the CLOUDFLARE_* repo secrets are configured.
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.web-detect.outputs.exists == 'true' &&
      secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build and deploy
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
