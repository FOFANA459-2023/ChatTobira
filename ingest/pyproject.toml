[project]
name = "chattobira-ingest"
version = "0.1.0"
description = "Vision-based ingestion pipeline for ChatTobira course materials"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "pymupdf>=1.24.0",
    "psycopg[binary]>=3.2.0",
    "fugashi[unidic-lite]>=1.3.2",
    "jaconv>=0.4.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
]

[project.scripts]
ingest = "ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# Typer's API requires these calls in parameter defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
